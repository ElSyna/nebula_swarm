# Configuration du bus (config Swarm, aucun secret ici).

# Utilisateur, file des messages en erreur et politique de renvoi.
# Le fichier est fourni par le secret nebula_bus_definitions.
load_definitions = /etc/rabbitmq/definitions.json

# RabbitMQ bloque les producteurs au-dela de ce seuil, avant que la limite
# memoire du service (512M) ne fasse tuer le conteneur.
vm_memory_high_watermark.absolute = 300MB
